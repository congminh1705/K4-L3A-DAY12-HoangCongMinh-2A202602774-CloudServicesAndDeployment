name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test checkpoints 1-4
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy
      REDIS_URL: fake://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline checkpoint tests
        run: python -m pytest tests/ -q -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PUBLIC_URL: https://k4-l3a-day12-hoangcongminh-2a202602774-cloudserv-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing GitHub Actions secret: RAILWAY_TOKEN" >&2
            exit 1
          fi
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0
      - name: Deploy tested commit
        run: railway up --environment production --service "${GITHUB_REPOSITORY#*/}" --message "$GITHUB_SHA"
      - name: Smoke test deployed service
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/health"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/ready"
